<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sVm Computer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- header class -->
    <header class="header">
      <!-- search bar and logo in right section of header -->
      <!-- cart li and moon li(later used in theme changing and js) are SVG's -->
      <div class="header-right-items">
        <img src="./images/Header Logo-edit2.png" alt="Header Logo" />
        <div class="search-bar">
          <input type="search" placeholder="جستجو در  کالا ها" />
          <button id="search-button" type="submit">
            <svg
              width="30"
              height="30"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <circle cx="10.5" cy="10.5" r="7"></circle>
              <path d="m16 16 5 5"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- cart, moon, signup/login and phone number which are in left section of header -->
      <div class="header-left-items">
        <ul class="header-ul">
          <li>021-910000</li>
          <li id="login-signup-li">ورود | ثبت نام</li>
          <li>
            <svg
              class="theme-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.985 12.486a9 9 0 1 1-9.473-9.472
             c.405-.022.617.463.402.807
             a6.5 6.5 0 0 0 8.268 8.268
             c.344-.215.829-.003.803.397Z"
              />
            </svg>
          </li>
          <li id="cart">
            <svg
              class="cart-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              />
            </svg>
          </li>
        </ul>
      </div>
    </header>

    <!-- products section -->
    <section class="products-container">
      <h1>GPU / کارت گرافیک</h1>
      <div class="gpu-container"></div>

      <h1>CPU / پردازنده مرکزی</h1>
      <div class="cpu-container"></div>

      <h1>RAM / حافظه اصلی</h1>
      <div class="ram-container"></div>

      <h2>Monitor / نمایشگر</h2>
      <div class="monitor-container"></div>
    </section>

    <footer class="site-footer">
      <div class="footer-line"></div>

      <p>
        Designed & Developed by
        <span class="footer-name">Hesam Sormeyli</span>
      </p>

      <div class="footer-credit">
        <span>© 2026</span>
        <span class="footer-divider">|</span>
        <span class="footer-brand">SVM845</span>
      </div>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
